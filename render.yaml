services:
  - type: web
    name: quiz-platform
    runtime: image
    plan: free
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          name: quiz-platform
          type: web
          property: url
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromService:
          name: quiz-db
          type: pserv
          property: host
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        value: quiz_platform
      - key: DB_USERNAME
        value: quiz_user
      - key: DB_PASSWORD
        fromService:
          name: quiz-db
          type: pserv
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database

  - type: pserv
    name: quiz-db
    plan: free
    type: mysql
    region: ohio
    version: "8.4"
